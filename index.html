<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>ChatZada</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #101010; color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 440px); text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 22px; display: grid;
      place-items: center; border: 1px solid #383838; border-radius: 18px;
      font-size: 27px; }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -1px; }
    p { margin: 0 auto 26px; color: #aaa; line-height: 1.6; }
    a { display: inline-block; padding: 13px 22px; border-radius: 999px;
      background: #f5f5f5; color: #111; text-decoration: none; font-weight: 650; }
    a:hover { background: #ddd; }
    small { display: block; margin-top: 22px; color: #777; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <h1>ChatZada</h1>
    <p>Acesse o ChatGPT pelo site oficial.</p>
    <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">
      Abrir ChatGPT
    </a>
    <small>O acesso será realizado em chatgpt.com. Esta página é independente e não é afiliada à OpenAI.</small>
  </main>
</body>
</html>
